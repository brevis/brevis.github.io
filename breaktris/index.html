<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3d3d42">
  <meta name="format-detection" content="telephone=no">
  <title>Breaktris</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="cv"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-row">
      <button id="btn-menu" class="icon" aria-label="Уровни">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
      </button>
      <div class="hud-center">
        <div id="hud-title">Уровень 1</div>
        <div id="hud-stars"><i>★</i><i>★</i><i>★</i></div>
        <div id="hud-sub"></div>
      </div>
      <button id="btn-undo" class="icon" aria-label="Отменить ход">
        <svg viewBox="0 0 24 24"><path d="M9 5 4 10l5 5" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10h9a5.5 5.5 0 0 1 0 11h-3" fill="none" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-hint" class="icon" aria-label="Подсказка">
        <svg viewBox="0 0 24 24"><path d="M12 3a6.5 6.5 0 0 0-3.8 11.8c.5.4.8 1 .8 1.6V17h6v-.6c0-.6.3-1.2.8-1.6A6.5 6.5 0 0 0 12 3Z"/><rect x="9" y="18.5" width="6" height="2.5" rx="1"/></svg>
        <span id="hint-count" class="badge">3</span>
      </button>
      <button id="btn-restart" class="icon" aria-label="Заново">
        <svg viewBox="0 0 24 24"><path d="M19.5 12A7.5 7.5 0 1 1 17 6.4" fill="none" stroke-width="2.6" stroke-linecap="round"/><path d="M18 2.5V7h-4.5" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="progress"><div id="progress-fill"></div></div>
  </div>

  <section id="screen-title" class="screen">
    <div class="logo"><span class="l1">BREAK</span><span class="l2">TRIS</span></div>
    <p class="tagline">Взорви фигуру до последнего блока</p>
    <canvas id="title-art" width="10" height="10"></canvas>
    <button id="btn-play" class="btn big">Играть</button>
    <button id="btn-levels" class="btn secondary">Уровни</button>
    <button id="btn-sound" class="btn ghost">Звук: вкл</button>
  </section>

  <section id="screen-levels" class="screen hidden">
    <header class="lv-head">
      <button id="btn-levels-back" class="icon" aria-label="Назад">
        <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2>Уровни</h2>
      <div id="total-stars">★ 0</div>
    </header>
    <div id="level-grid"></div>
  </section>

  <div id="modal" class="hidden"><div id="modal-card" class="card"></div></div>
  <div id="toast" class="hidden"></div>
  <div id="safe-probe"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
