<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#221d5c">
  <meta name="format-detection" content="telephone=no">
  <title>Kaboomino</title>
  <meta name="description" content="A block puzzle played backwards: drag explosive charges onto a shape and blow it up, down to the last block.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kaboomino">
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=202609241200">
</head>
<body>
  <div id="game-bg" aria-hidden="true"><i class="s1"></i><i class="s2"></i></div>
  <canvas id="cv"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-row">
      <button id="btn-menu" class="icon" aria-label="Levels">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
      </button>
      <div class="hud-center">
        <div id="hud-title">Level 1</div>
        <div id="hud-stars"><i>★</i><i>★</i><i>★</i></div>
        <div id="hud-sub"></div>
      </div>
      <button id="btn-undo" class="icon" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M9 5 4 10l5 5" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10h9a5.5 5.5 0 0 1 0 11h-3" fill="none" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-hint" class="icon" aria-label="Hint">
        <svg viewBox="0 0 24 24"><path d="M12 3a6.5 6.5 0 0 0-3.8 11.8c.5.4.8 1 .8 1.6V17h6v-.6c0-.6.3-1.2.8-1.6A6.5 6.5 0 0 0 12 3Z"/><rect x="9" y="18.5" width="6" height="2.5" rx="1"/></svg>
        <span id="hint-count" class="badge">3</span>
      </button>
      <button id="btn-restart" class="icon" aria-label="Restart">
        <svg viewBox="0 0 24 24"><path d="M19.5 12A7.5 7.5 0 1 1 17 6.4" fill="none" stroke-width="2.6" stroke-linecap="round"/><path d="M18 2.5V7h-4.5" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="progress-row"><div id="progress"><div id="progress-fill"></div></div><span id="hud-score">0</span></div>
  </div>

  <section id="screen-title" class="screen">
    <canvas id="title-bg"></canvas>
    <button id="btn-sound" class="round-btn" aria-label="Sound"><svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke-width="2.4" stroke-linecap="round"/></svg><svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <div class="logo"><span class="l1">KABOOM</span><span class="l2">INO</span></div>
    <div class="emblem"><canvas id="title-art" width="10" height="10"></canvas><span class="spark" id="title-spark"></span></div>
    <button id="btn-play" class="btn big">Play</button>
    <button id="btn-blitz" class="btn blitz">⚡ Blitz</button>
    <button id="btn-levels" class="btn secondary">Levels</button>
  </section>

  <section id="screen-levels" class="screen hidden">
    <header class="lv-head">
      <button id="btn-levels-back" class="icon" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2>Levels</h2>
      <div id="total-stars">★ 0</div>
    </header>
    <div id="level-grid"></div>
  </section>

  <div id="modal" class="hidden"><div id="modal-card" class="card"></div></div>
  <div id="toast" class="hidden"></div>
  <div id="safe-probe"></div>

  <script type="importmap">{"imports":{"./js/audio.js":"./js/audio.js?v=202609241200","./js/blitz.js":"./js/blitz.js?v=202609241200","./js/fx.js":"./js/fx.js?v=202609241200","./js/game.js":"./js/game.js?v=202609241200","./js/levels.js":"./js/levels.js?v=202609241200","./js/logic.js":"./js/logic.js?v=202609241200","./js/main.js":"./js/main.js?v=202609241200","./js/sprites.js":"./js/sprites.js?v=202609241200","./js/title-bg.js":"./js/title-bg.js?v=202609241200"}}</script>
  <script type="module" src="js/main.js?v=202609241200"></script>
</body>
</html>
